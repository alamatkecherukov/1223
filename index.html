<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мой сайт</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f4f7fc;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
        }
        .hero {
            background: linear-gradient(135deg, #1a2b4a, #2a4a7a);
            color: white;
            padding: 4rem 2rem;
            border-radius: 32px;
            text-align: center;
            margin-bottom: 2rem;
        }
        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .hero p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        .articles {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
        .article {
            background: white;
            border-radius: 28px;
            padding: 1.8rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #eef3f9;
            transition: 0.3s;
        }
        .article:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }
        .article .cover {
            width: 100%;
            height: 180px;
            border-radius: 16px;
            overflow: hidden;
            background: #e7eef9;
            margin-bottom: 14px;
        }
        .article .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .article h3 {
            font-size: 1.3rem;
            color: #141f33;
            margin-bottom: 6px;
        }
        .article p {
            color: #5a6f8a;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .article .tag {
            display: inline-block;
            background: #e7eef9;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #1f3a5e;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .article .link {
            color: #2a7de1;
            text-decoration: none;
            font-weight: 500;
        }
        .edit-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2a7de1;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(42,125,225,0.3);
            transition: 0.2s;
        }
        .edit-link:hover {
            background: #1a5fb0;
            transform: scale(1.02);
        }
        .empty {
            text-align: center;
            padding: 4rem 2rem;
            color: #6e7f9b;
            background: white;
            border-radius: 40px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="content">
            <!-- Содержимое будет загружено из data.json -->
            <div class="hero">
                <h1>Загрузка...</h1>
                <p>Пожалуйста, подождите</p>
            </div>
        </div>

        <!-- Кнопка для входа в редактор -->
        <a href="edit.html" class="edit-link">
            <i class="fas fa-pen"></i> Редактировать
        </a>
    </div>

    <script>
        // ================================================================
        //  ЗАГРУЗКА ДАННЫХ ИЗ data.json
        // ================================================================
        async function loadData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Файл data.json не найден');
                const data = await response.json();
                renderSite(data);
            } catch (error) {
                console.warn('Использую данные по умолчанию');
                renderSite(getDefaultData());
            }
        }

        function getDefaultData() {
            return {
                heroTitle: 'Добро пожаловать!',
                heroSubtitle: 'Ваш сайт на GitHub Pages',
                articles: [
                    {
                        title: 'Пример статьи 1',
                        description: 'Это первая статья на вашем сайте. Вы можете её отредактировать.',
                        tag: 'Технологии',
                        url: '#',
                        cover: ''
                    },
                    {
                        title: 'Пример статьи 2',
                        description: 'Вторая статья для демонстрации работы сайта.',
                        tag: 'Дизайн',
                        url: '#',
                        cover: ''
                    }
                ]
            };
        }

        function renderSite(data) {
            let html = '';

            // Шапка-герой
            html += `
                <div class="hero">
                    <h1>${escapeHtml(data.heroTitle)}</h1>
                    <p>${escapeHtml(data.heroSubtitle)}</p>
                </div>
            `;

            // Сетка статей
            html += `<div class="articles">`;
            if (data.articles && data.articles.length > 0) {
                data.articles.forEach(article => {
                    const coverHtml = article.cover ?
                        `<img src="${article.cover}" alt="обложка" />` :
                        `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8a9bb8;font-size:0.8rem;">Нет обложки</div>`;
                    html += `
                        <div class="article">
                            <div class="cover">${coverHtml}</div>
                            <div class="tag">${escapeHtml(article.tag || 'Статья')}</div>
                            <h3>${escapeHtml(article.title)}</h3>
                            <p>${escapeHtml(article.description)}</p>
                            <a href="${escapeHtml(article.url)}" target="_blank" class="link">Читать →</a>
                        </div>
                    `;
                });
            } else {
                html += `<div class="empty">Пока нет статей. Добавьте их в редакторе.</div>`;
            }
            html += `</div>`;

            document.getElementById('content').innerHTML = html;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>"']/g, function(m) {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return map[m];
            });
        }

        // Загружаем данные при открытии страницы
        loadData();
    </script>
</body>
</html>

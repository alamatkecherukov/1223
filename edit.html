<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Редактор сайта</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f4f7fc;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
        }
        h1 {
            color: #1a2b4a;
            margin-bottom: 1.5rem;
        }
        .field {
            margin-bottom: 1.2rem;
        }
        .field label {
            display: block;
            font-weight: 600;
            color: #1f2b44;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }
        .field input,
        .field textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #dce3ef;
            border-radius: 16px;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .field input:focus,
        .field textarea:focus {
            outline: none;
            border-color: #2a7de1;
            box-shadow: 0 0 0 3px rgba(42,125,225,0.1);
        }
        .field textarea {
            min-height: 80px;
            resize: vertical;
        }
        .article-block {
            background: #f8fafd;
            border-radius: 20px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            border: 1px solid #eef3f9;
        }
        .article-block .remove {
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            float: right;
            margin-top: -8px;
        }
        .article-block .remove:hover {
            background: #cc0000;
        }
        .btn {
            background: #2a7de1;
            color: white;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
        }
        .btn:hover {
            background: #1a5fb0;
            transform: scale(1.02);
        }
        .btn-secondary {
            background: #e7eef9;
            color: #1f2b44;
        }
        .btn-secondary:hover {
            background: #d5dfec;
        }
        .btn-success {
            background: #28a745;
        }
        .btn-success:hover {
            background: #218838;
        }
        .btn-danger {
            background: #ff4444;
        }
        .btn-danger:hover {
            background: #cc0000;
        }
        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .status {
            padding: 8px 14px;
            border-radius: 20px;
            margin-top: 12px;
            font-size: 0.9rem;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        .cover-upload {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .cover-upload input[type="file"] {
            display: none;
        }
        .cover-preview {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            overflow: hidden;
            background: #e7eef9;
            flex-shrink: 0;
        }
        .cover-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cover-upload .upload-btn {
            background: #e7eef9;
            border: 1px dashed #dce3ef;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            color: #1f2b44;
            transition: 0.2s;
        }
        .cover-upload .upload-btn:hover {
            background: #d5dfec;
        }
        .github-settings {
            background: #f8fafd;
            border-radius: 20px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            border: 1px solid #eef3f9;
        }
        .github-settings h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #1a2b4a;
        }
        .github-settings input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #dce3ef;
            border-radius: 30px;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .github-settings input:focus {
            outline: none;
            border-color: #2a7de1;
        }
        .back-link {
            display: inline-block;
            margin-top: 1rem;
            color: #2a7de1;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2b44;
            color: white;
            padding: 12px 30px;
            border-radius: 60px;
            font-size: 0.95rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            z-index: 99999;
            opacity: 0;
            transition: 0.4s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
        @media (max-width: 600px) {
            body { padding: 1rem; }
            .container { padding: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-pen-to-square"></i> Редактор сайта</h1>

        <!-- НАСТРОЙКИ GITHUB -->
        <div class="github-settings">
            <h3><i class="fab fa-github"></i> Настройки GitHub</h3>
            <input type="text" id="githubRepo" placeholder="username/repo" />
            <input type="text" id="githubFile" placeholder="data.json" value="data.json" />
            <input type="password" id="githubToken" placeholder="Personal Access Token" />
            <button class="btn btn-secondary" id="saveGithubBtn" style="width:100%;">Сохранить настройки</button>
            <div id="githubStatus" class="status info" style="display:none;"></div>
        </div>

        <div id="editorContent">
            <!-- Редактор будет загружен из data.json -->
            <p style="color:#8a9bb8;">Загрузка данных...</p>
        </div>

        <div class="buttons">
            <button class="btn btn-success" id="saveBtn"><i class="fas fa-save"></i> Сохранить на GitHub</button>
            <button class="btn btn-secondary" id="addArticleBtn"><i class="fas fa-plus"></i> Добавить статью</button>
        </div>

        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Вернуться на сайт</a>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ================================================================
        //  1. ДАННЫЕ
        // ================================================================
        let data = {
            heroTitle: 'Добро пожаловать!',
            heroSubtitle: 'Ваш сайт на GitHub Pages',
            articles: []
        };

        let githubConfig = {
            repo: '',
            file: 'data.json',
            token: ''
        };

        // ================================================================
        //  2. DOM-ссылки
        // ================================================================
        const editorContent = document.getElementById('editorContent');
        const saveBtn = document.getElementById('saveBtn');
        const addArticleBtn = document.getElementById('addArticleBtn');
        const githubRepo = document.getElementById('githubRepo');
        const githubFile = document.getElementById('githubFile');
        const githubToken = document.getElementById('githubToken');
        const saveGithubBtn = document.getElementById('saveGithubBtn');
        const githubStatus = document.getElementById('githubStatus');
        const toast = document.getElementById('toast');

        // ================================================================
        //  3. ЗАГРУЗКА НАСТРОЕК GITHUB
        // ================================================================
        function loadGithubConfig() {
            const saved = localStorage.getItem('githubConfig');
            if (saved) {
                try {
                    githubConfig = JSON.parse(saved);
                    githubRepo.value = githubConfig.repo || '';
                    githubFile.value = githubConfig.file || 'data.json';
                    githubToken.value = githubConfig.token || '';
                } catch (e) {}
            }
        }

        function saveGithubConfig() {
            githubConfig.repo = githubRepo.value.trim();
            githubConfig.file = githubFile.value.trim();
            githubConfig.token = githubToken.value.trim();
            localStorage.setItem('githubConfig', JSON.stringify(githubConfig));
            showToast('✅ Настройки GitHub сохранены');
            showGithubStatus('Настройки сохранены', 'success');
        }

        function showGithubStatus(text, type = 'info') {
            githubStatus.textContent = text;
            githubStatus.className = 'status ' + type;
            githubStatus.style.display = 'block';
            setTimeout(() => { githubStatus.style.display = 'none'; }, 5000);
        }

        // ================================================================
        //  4. ЗАГРУЗКА ДАННЫХ ИЗ data.json
        // ================================================================
        async function loadData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Файл не найден');
                data = await response.json();
                renderEditor();
            } catch (error) {
                console.warn('Использую данные по умолчанию');
                data = {
                    heroTitle: 'Добро пожаловать!',
                    heroSubtitle: 'Ваш сайт на GitHub Pages',
                    articles: []
                };
                renderEditor();
            }
        }

        // ================================================================
        //  5. РЕНДЕР РЕДАКТОРА
        // ================================================================
        function renderEditor() {
            let html = '';

            // Шапка-герой
            html += `
                <div class="field">
                    <label>Заголовок шапки</label>
                    <input type="text" id="heroTitle" value="${escapeHtml(data.heroTitle)}" />
                </div>
                <div class="field">
                    <label>Подзаголовок шапки</label>
                    <input type="text" id="heroSubtitle" value="${escapeHtml(data.heroSubtitle)}" />
                </div>
                <hr style="margin: 1.5rem 0; border: none; border-top: 2px dashed #eef3f9;" />
                <h3 style="margin-bottom: 1rem;">Статьи</h3>
            `;

            if (data.articles && data.articles.length > 0) {
                data.articles.forEach((article, index) => {
                    const coverHtml = article.cover ?
                        `<img src="${article.cover}" alt="обложка" />` :
                        `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8a9bb8;font-size:0.6rem;">Нет</div>`;
                    html += `
                        <div class="article-block" data-index="${index}">
                            <button class="remove" data-index="${index}"><i class="fas fa-times"></i></button>
                            <div class="field">
                                <label>Название</label>
                                <input type="text" class="article-title" value="${escapeHtml(article.title)}" />
                            </div>
                            <div class="field">
                                <label>Описание</label>
                                <textarea class="article-desc">${escapeHtml(article.description)}</textarea>
                            </div>
                            <div class="field">
                                <label>Тег</label>
                                <input type="text" class="article-tag" value="${escapeHtml(article.tag || 'Статья')}" />
                            </div>
                            <div class="field">
                                <label>Ссылка</label>
                                <input type="text" class="article-url" value="${escapeHtml(article.url || '#')}" />
                            </div>
                            <div class="field">
                                <label>Обложка</label>
                                <div class="cover-upload">
                                    <div class="cover-preview">${coverHtml}</div>
                                    <button class="upload-btn upload-cover" data-index="${index}"><i class="fas fa-image"></i> Загрузить</button>
                                    <button class="upload-btn remove-cover" data-index="${index}" style="border-color:#ff4444;color:#ff4444;"><i class="fas fa-times"></i> Удалить</button>
                                    <input type="file" class="cover-file" data-index="${index}" accept="image/*" style="display:none;" />
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else {
                html += `
                    <div style="text-align:center;padding:2rem;color:#8a9bb8;background:#f8fafd;border-radius:20px;">
                        <i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:10px;"></i>
                        Нет статей. Нажмите "Добавить статью".
                    </div>
                `;
            }

            editorContent.innerHTML = html;

            // ---- ОБРАБОТЧИКИ ----

            // Удаление статьи
            document.querySelectorAll('.remove').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = Number(this.dataset.index);
                    if (confirm('Удалить эту статью?')) {
                        data.articles.splice(index, 1);
                        renderEditor();
                        showToast('🗑️ Статья удалена');
                    }
                });
            });

            // Загрузка обложки
            document.querySelectorAll('.upload-cover').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = Number(this.dataset.index);
                    const fileInput = document.querySelector(`.cover-file[data-index="${index}"]`);
                    if (fileInput) fileInput.click();
                });
            });

            document.querySelectorAll('.cover-file').forEach(input => {
                input.addEventListener('change', function() {
                    const index = Number(this.dataset.index);
                    const file = this.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        data.articles[index].cover = ev.target.result;
                        renderEditor();
                        showToast('✅ Обложка загружена');
                    };
                    reader.readAsDataURL(file);
                    this.value = '';
                });
            });

            // Удаление обложки
            document.querySelectorAll('.remove-cover').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = Number(this.dataset.index);
                    if (data.articles[index]) {
                        data.articles[index].cover = '';
                        renderEditor();
                        showToast('🗑️ Обложка удалена');
                    }
                });
            });

            // Сохранение изменений в data (при вводе)
            document.querySelectorAll('.article-title').forEach((input, i) => {
                input.addEventListener('input', function() {
                    if (data.articles[i]) data.articles[i].title = this.value;
                });
            });
            document.querySelectorAll('.article-desc').forEach((input, i) => {
                input.addEventListener('input', function() {
                    if (data.articles[i]) data.articles[i].description = this.value;
                });
            });
            document.querySelectorAll('.article-tag').forEach((input, i) => {
                input.addEventListener('input', function() {
                    if (data.articles[i]) data.articles[i].tag = this.value;
                });
            });
            document.querySelectorAll('.article-url').forEach((input, i) => {
                input.addEventListener('input', function() {
                    if (data.articles[i]) data.articles[i].url = this.value;
                });
            });

            // Шапка
            const heroTitle = document.getElementById('heroTitle');
            const heroSubtitle = document.getElementById('heroSubtitle');
            if (heroTitle) {
                heroTitle.addEventListener('input', function() { data.heroTitle = this.value; });
            }
            if (heroSubtitle) {
                heroSubtitle.addEventListener('input', function() { data.heroSubtitle = this.value; });
            }
        }

        // ================================================================
        //  6. ДОБАВЛЕНИЕ СТАТЬИ
        // ================================================================
        addArticleBtn.addEventListener('click', function() {
            if (!data.articles) data.articles = [];
            data.articles.push({
                title: 'Новая статья',
                description: 'Описание...',
                tag: 'Статья',
                url: '#',
                cover: ''
            });
            renderEditor();
            showToast('✅ Статья добавлена');
        });

        // ================================================================
        //  7. СОХРАНЕНИЕ НА GITHUB
        // ================================================================
        saveBtn.addEventListener('click', async function() {
            if (!githubConfig.repo || !githubConfig.token) {
                showToast('⚠️ Сначала настройте GitHub');
                return;
            }

            try {
                showToast('⏳ Сохранение...');

                // Собираем данные из редактора
                const heroTitle = document.getElementById('heroTitle');
                const heroSubtitle = document.getElementById('heroSubtitle');
                if (heroTitle) data.heroTitle = heroTitle.value;
                if (heroSubtitle) data.heroSubtitle = heroSubtitle.value;

                // Обновляем статьи из полей
                document.querySelectorAll('.article-block').forEach((block, index) => {
                    const title = block.querySelector('.article-title');
                    const desc = block.querySelector('.article-desc');
                    const tag = block.querySelector('.article-tag');
                    const url = block.querySelector('.article-url');
                    if (data.articles[index]) {
                        if (title) data.articles[index].title = title.value;
                        if (desc) data.articles[index].description = desc.value;
                        if (tag) data.articles[index].tag = tag.value;
                        if (url) data.articles[index].url = url.value;
                    }
                });

                const jsonData = JSON.stringify(data, null, 2);
                const encoded = btoa(unescape(encodeURIComponent(jsonData)));

                let sha = null;
                try {
                    const checkResponse = await fetch(
                        `https://api.github.com/repos/${githubConfig.repo}/contents/${githubConfig.file}`, {
                            headers: {
                                'Authorization': `token ${githubConfig.token}`,
                                'Accept': 'application/vnd.github.v3+json'
                            }
                        }
                    );
                    if (checkResponse.ok) {
                        const result = await checkResponse.json();
                        sha = result.sha;
                    }
                } catch (e) {}

                const response = await fetch(
                    `https://api.github.com/repos/${githubConfig.repo}/contents/${githubConfig.file}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${githubConfig.token}`,
                            'Content-Type': 'application/json',
                            'Accept': 'application/vnd.github.v3+json'
                        },
                        body: JSON.stringify({
                            message: 'Обновление данных сайта',
                            content: encoded,
                            sha: sha,
                            branch: 'main'
                        })
                    }
                );

                if (response.ok) {
                    showToast('✅ Данные сохранены на GitHub!');
                    showGithubStatus('✅ Успешно сохранено', 'success');
                } else {
                    const error = await response.json();
                    showToast('❌ Ошибка: ' + (error.message || 'Неизвестная ошибка'));
                    showGithubStatus('❌ Ошибка: ' + (error.message || 'Неизвестная ошибка'), 'error');
                }
            } catch (e) {
                showToast('❌ Ошибка: ' + e.message);
                showGithubStatus('❌ Ошибка: ' + e.message, 'error');
            }
        });

        // ================================================================
        //  8. НАСТРОЙКИ GITHUB
        // ================================================================
        saveGithubBtn.addEventListener('click', function() {
            saveGithubConfig();
        });

        // ================================================================
        //  9. TOAST
        // ================================================================
        function showToast(text) {
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>"']/g, function(m) {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return map[m];
            });
        }

        // ================================================================
        //  10. ЗАГРУЗКА
        // ================================================================
        loadGithubConfig();
        loadData();
    </script>
</body>
</html>
